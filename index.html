<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Hydrated with Sapphira</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Úvodná obrazovka -->
    <div id="splashScreen">
        <img
            id="splashImage"
            src="IMG_0851.jpeg"
            alt="Sapphira">

        <h1>💧 Get Hydrated</h1>
        <h2>with Sapphira 🐰</h2>

        <button id="startButton" type="button">
            Begin
        </button>
    </div>

    <!-- Hlavná aplikácia -->
    <main id="app" class="app hidden">
        <h1>
            💧 Get Hydrated
            <br>
            with Sapphira 🐰
        </h1>

        <img
            id="bunnyImage"
            src="IMG_5819.jpeg"
            alt="Sapphira">

        <p id="statusText" aria-live="polite">
            Loading...
        </p>

        <div id="dateText">--</div>

        <div id="streak" aria-live="polite">
            🔥 Streak: 0
        </div>

        <div id="progressText" aria-live="polite">
            0 / 2500 ml
        </div>

        <div
            class="bar"
            role="progressbar"
            aria-label="Denný príjem vody"
            aria-valuemin="0"
            aria-valuemax="2500">

            <div id="fill"></div>
        </div>

        <div class="buttons">
            <button id="add100" type="button">+100 ml</button>
            <button id="add200" type="button">+200 ml</button>
            <button id="add500" type="button">+500 ml</button>
        </div>

        <button id="resetButton" class="resetBtn" type="button">
            Reset day
        </button>
    </main>

    <script src="script.js"></script>
</body>
</html>
